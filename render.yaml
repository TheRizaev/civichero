services:
  - type: web
    name: civichero-web
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        fromDatabase:
          name: civichero-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false 
    
  - type: worker
    name: civichero-bot
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python telegram_bot.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: DATABASE_URL
        fromDatabase:
          name: civichero-db
          property: connectionString
      - key: BOT_TOKEN
        sync: false 

databases:
  - name: civichero-db
    databaseName: civichero
    user: civichero
